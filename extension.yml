# =============================================================================
# spec-kit-jira-sync — spec-kit extension manifest
# =============================================================================
#
# This file is the installation contract read by `specify extension add jira-sync`
# (the specify-cli extensions installer). The CLI validates this manifest,
# copies the repo into the consumer's `.specify/extensions/jira-sync/`, registers
# any hooks below into the consumer's `.specify/extensions.yml`, and (if the
# consumer initialised with `--ai-skills`) auto-generates one SKILL.md per
# command under `.claude/skills/spec-kit-jira-sync-<sub>/`.
#
# Field shape mirrors the sibling extension `spec-kit-linear-sync`
# (extension.yml) exactly for every field the framework cares about. This bridge
# is the AUTOMATIC mirror its constitution always specified (Principle VII): it
# ships the reconcile commands (push/status/install/seed) AND auto-registers the
# six `after_*` lifecycle hooks below, so every `/speckit-*` command mirrors the
# spec state to Jira with nothing to remember. Informational fields (`config:`)
# are still listed so operators reading the manifest understand the config seam.
#
# Privacy (constitution Principle IX): this manifest is committed to a PUBLIC
# repo and MUST stay free of real Jira coordinates/PII — no site, project key,
# account ids, cloudIds, or tokens. Real binding values live ONLY in the
# gitignored `.specify/extensions/jira-sync/jira-config.yml` and `.env`.
# =============================================================================

# Manifest schema version. The CLI hard-requires "1.0"; any other value aborts
# install before anything else runs.
schema_version: "1.0"

# ---------------------------------------------------------------------------
# `extension:` — identity, version, attribution.
# id / name / version / description are required by the CLI validator;
# author / repository / license / homepage are optional but surfaced in the
# community catalog UI.
# ---------------------------------------------------------------------------
extension:
  # Lowercase-kebab id used throughout the framework and as the directory name
  # under `.specify/extensions/`. MUST match ^[a-z0-9-]+$. Command names below
  # are required to start with `speckit.<id>.` — i.e. `speckit.jira-sync.`.
  #
  # ONE NAME, EVERYWHERE (feature 013, v0.6.0 — BREAKING): the framework id,
  # the COMMUNITY CATALOG key, the command namespace and the install directory
  # are all `jira-sync`. Before v0.6.0 this manifest declared `id: "jira"`
  # while the catalog listed `jira-sync`, so the updater resolved our users to
  # the unrelated extension that owns the bare `jira` slot. The id below is the
  # single published identity; `src/identity.sh` is its runtime twin, and
  # `tests/unit/extension_identity.bats` pins the two together.
  id: "jira-sync"

  # Human-readable name surfaced in `specify extension list` and the catalog.
  name: "spec-kit-jira-sync"

  # PEP 440 version. v0.6.0 (BREAKING) lands feature 013 — extension identity
  # realignment: the manifest id, the catalog key, the command namespace and the
  # install directory are one value (`jira-sync`), so the catalog updater can no
  # longer resolve this bridge to the unrelated extension holding the `jira`
  # slot. Operator-invoked command names change; nothing the bridge projects to
  # Jira does. v0.5.0 added feature 011 (auto-registered `after_*` hooks —
  # the automatic mirror, implementing Principle VII) and feature 012 (hook
  # self-healing — detect + consented repair of stripped auto-sync hooks) on top
  # of the v0.4.0 baseline (006 privacy guard + 008 install/seed ceremony + 009
  # title source ladder + 010 lifecycle→subtask cascade, over the v0.3.0 core:
  # 001 bridge + 002 mapping + 003 engine + 004 re-mode + 005 ADR + 007
  # attribution).
  version: "0.6.0"

  # One-line description — matches the catalog entry + README cover.
  description: "An idempotent, drift-aware, fail-closed reconcile engine that mirrors spec-kit specs into Jira (Epic per repo, Story per spec, Subtask per phase)."

  # Optional fields — author + repo make the manifest self-describing.
  author: "Ash Brener"
  repository: "https://github.com/ashbrener/spec-kit-jira-sync"
  license: "MIT"
  homepage: "https://github.com/ashbrener/spec-kit-jira-sync"

# ---------------------------------------------------------------------------
# `requires:` — runtime preconditions the CLI validates at install.
# Only `speckit_version` is first-class. The Jira REST endpoint + Basic-auth
# credential checks are not declarable here; they are enforced at reconcile
# time inside the sink (config::validate + the fail-closed Jira read), which
# exits 2 on missing/invalid config and 3 on an unreadable Jira.
# ---------------------------------------------------------------------------
requires:
  # Conventional floor used by sibling community extensions. Keep at ">=0.1.0"
  # until a specific framework feature forces a higher floor.
  speckit_version: ">=0.1.0"
  # NOTE: Jira base URL, Basic-auth token (JIRA_BASE_URL / JIRA_EMAIL /
  # JIRA_API_TOKEN), and `jira-config.yml` validity are NOT declarable in
  # `requires:`. They are resolved from the gitignored `.env` /
  # `.specify/extensions/jira-sync/jira-config.yml` and checked at reconcile time.

# ---------------------------------------------------------------------------
# `provides:` — what this extension contributes to the consumer repo.
# Must contain at least one of `commands` or `hooks`. This bridge ships the
# reconcile commands AND auto-registers the six `after_*` lifecycle hooks (see
# `hooks:` below): every `/speckit-*` command auto-mirrors the spec state to
# Jira (Principle VII — Memory-Just-Works). The on-demand commands remain as the
# recovery / escape-hatch path; the automatic mirror is the primary UX.
# ---------------------------------------------------------------------------
provides:

  # -------------------------------------------------------------------------
  # `commands:` — the slash-command surface area of this extension.
  #
  # Naming convention enforced by the CLI: each `name` MUST match
  # `speckit.<extension.id>.<sub>` — i.e. `speckit.jira-sync.<sub>`.
  #
  # `file` is the path RELATIVE TO this extension's root and points at the
  # Markdown body the host agent (Claude Code, etc.) executes when the operator
  # runs the corresponding slash command. These two files are the installable
  # twins of the dev-layout `.claude/commands/speckit-jira-sync-*.md` and carry the
  # identical behaviour — they only differ in frontmatter shape (manifest-style
  # `name:` + `arguments:`) so the installer can register them.
  # -------------------------------------------------------------------------
  commands:

    # The core reconcile entry point. Reads the consumer repo's filesystem
    # state for every `specs/NNN-feature/` directory and pushes whatever Jira
    # needs to converge. Idempotent, drift-aware, fail-closed. The ONLY path
    # that mutates Jira.
    - name: "speckit.jira-sync.push"
      file: "commands/jira-sync-push.md"
      description: "Reconcile filesystem spec state -> Jira for every spec (or one --spec NNN) in the consumer repo. Idempotent; drift-aware; the only path that mutates Jira."

    # Read-only visibility: runs the reconcile engine in --dry-run, planning
    # every write but issuing none. Mutates neither Jira nor the filesystem.
    - name: "speckit.jira-sync.status"
      file: "commands/jira-sync-status.md"
      description: "Read-only sync status / drift preview: what would be created/updated/transitioned, plus any backward-drift (Jira ahead of disk). Never mutates."

    # The install on-ramp (feature 008). Resolves the per-repo binding (project
    # key, issue-type ids, the 6 lifecycle phase→status ids, story-points field
    # id) over the Jira REST API and writes the gitignored jira-config.yml —
    # ending the hand-edit. Idempotent (byte-identical re-run); fail-closed.
    - name: "speckit.jira-sync.install"
      file: "commands/jira-sync-install.md"
      description: "Resolve the per-repo Jira binding (project key, issue-type ids, phase->status map, story-points field) over REST and write the gitignored jira-config.yml. No more hand-editing ids. Idempotent; fail-closed (exit 2/3)."

    # The seed trust gate (feature 008). Validates the phase:* / task-phase:N
    # label conventions and confirms every lifecycle status is reachable on the
    # project's workflow before the first real reconcile. Never mutates the
    # admin-scoped workflow; safe to re-run.
    - name: "speckit.jira-sync.seed"
      file: "commands/jira-sync-seed.md"
      description: "Validate the phase:* / task-phase:N labels and confirm every lifecycle status is reachable on the project's workflow. Never mutates the workflow; idempotent; fail-closed (exit 2)."

  # -------------------------------------------------------------------------
  # `hooks:` — auto-registered into the consumer's `.specify/extensions.yml`
  # by the CLI at `specify extension add jira-sync` time (and idempotently
  # repaired by the install ceremony's `install::register_after_hooks`, the
  # parity/self-heal path).
  #
  # Per FR-001 / Principle VII, all six relevant `after_*` hooks are registered
  # with `optional: false` — every `/speckit-*` lifecycle command mirrors the
  # spec state to Jira without an explicit push. `optional: false` is the
  # REGISTRATION mandate (the hook is non-skippable); it does NOT mean the host
  # command fails if the sync fails. An `after_*` hook fires AFTER the lifecycle
  # command has already completed, so a sync that can't run (no creds, no
  # jira-config.yml, Jira unreachable) degrades to a clean WARNING and never
  # fails or blocks the spec-kit command (Principle VIII; FR-004).
  #
  # An operator may turn a single hook off by setting `enabled: false` in their
  # consumer file; the install registrar honours that and never re-enables it.
  #
  # NO `before_*` hooks: this extension never pre-empts a lifecycle step — it
  # only mirrors AFTER each transition. All six point at the same command
  # (`speckit.jira-sync.push`) because reconcile is the single convergent operation
  # (one sync path; idempotent; zero-churn on unchanged state).
  # -------------------------------------------------------------------------
  hooks:

    # After /speckit-specify — the spec Story is created in Jira at its initial
    # status (the board entry for the new spec appears).
    after_specify:
      - command: "speckit.jira-sync.push"
        description: "Reconcile after /speckit-specify so the new spec Story exists in Jira with the correct initial status."
        prompt: "Reconciling spec.md to Jira..."
        optional: false
        enabled: true

    # After /speckit-clarify — ratified Q/A appears as comments on the spec
    # Story; no status change.
    after_clarify:
      - command: "speckit.jira-sync.push"
        description: "Reconcile after /speckit-clarify so ratified clarifications appear as comments on the spec Story."
        prompt: "Reconciling clarification rounds to Jira comments..."
        optional: false
        enabled: true

    # After /speckit-plan — the spec Story advances to the planning status and
    # plan summaries / ADR decisions mirror as comments.
    after_plan:
      - command: "speckit.jira-sync.push"
        description: "Reconcile after /speckit-plan so the spec Story advances to the planning status and plan/ADR summaries appear as comments."
        prompt: "Reconciling plan.md to Jira..."
        optional: false
        enabled: true

    # After /speckit-tasks — each lifecycle phase becomes a Subtask of the spec
    # Story with the right checklist.
    after_tasks:
      - command: "speckit.jira-sync.push"
        description: "Reconcile after /speckit-tasks so each lifecycle phase becomes a Jira Subtask of the spec Story with the right checklist."
        prompt: "Reconciling tasks.md to Jira subtasks..."
        optional: false
        enabled: true

    # After /speckit-implement — checklist completion state and the lifecycle
    # status roll up in Jira.
    after_implement:
      - command: "speckit.jira-sync.push"
        description: "Reconcile after /speckit-implement so checklist completion and the lifecycle status roll up in Jira."
        prompt: "Reconciling implementation progress to Jira..."
        optional: false
        enabled: true

    # After /speckit-analyze — analyze findings mirror as comments on the spec
    # Story.
    after_analyze:
      - command: "speckit.jira-sync.push"
        description: "Reconcile after /speckit-analyze so analyze findings appear as comments on the spec Story."
        prompt: "Reconciling analyze findings to Jira comments..."
        optional: false
        enabled: true

  # -------------------------------------------------------------------------
  # `config:` — INFORMATIONAL. The CLI does NOT auto-scaffold this file on
  # install. The runtime binding `jira-config.yml` is produced by copying the
  # committed `config-template.yml` into
  # `.specify/extensions/jira-sync/jira-config.yml` and filling in the real ids
  # (project key, issue-type ids, phase->status ids). The resolved copy is
  # gitignored; only the placeholder template is committed.
  # -------------------------------------------------------------------------
  config:
    - name: "jira-config.yml"
      template: "config-template.yml"
      description: "Per-repo Jira binding: project_key, issue_types (epic/story/subtask), phase_status map, label prefixes, optional configurable mapping. Copied from config-template.yml into .specify/extensions/jira-sync/ and filled with the project's real ids. Gitignored (Principle IX)."
      required: true

# ---------------------------------------------------------------------------
# `tags:` — free-form catalog metadata. No framework behaviour depends on
# these; they exist to make the community catalog searchable.
# ---------------------------------------------------------------------------
tags:
  - "issue-tracking"
  - "jira"
  - "tasks-sync"
  - "lifecycle-mirror"
  - "reconcile"
  - "drift-aware"

# ---------------------------------------------------------------------------
# `defaults:` — install-time defaults the install/seed steps may consult.
# Best-effort safe defaults; the sink verifies the real binding against Jira
# at reconcile time and fails closed on any mismatch.
#
# IMPORTANT: no secrets. The Jira Basic-auth token + email live ONLY in the
# operator's gitignored `.env` (JIRA_BASE_URL / JIRA_EMAIL / JIRA_API_TOKEN).
# This manifest is committed to the public repo and MUST stay secret-free.
# ---------------------------------------------------------------------------
defaults:
  # Jira Cloud REST base path the sink targets. The operator sets the actual
  # site origin via JIRA_BASE_URL in their gitignored `.env`; this default
  # documents the REST API version the bridge speaks (v3).
  rest_api_version: "3"
